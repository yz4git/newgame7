name: DEEP WEAVE iPhone playcheck
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'version.json'
      - 'scripts/stamp-release.cjs'
      - 'engine.js'
      - 'game.js'
      - 'style.css'
      - 'tests/browser.playcheck.cjs'
      - '.github/workflows/playcheck.yml'
permissions:
  contents: read
concurrency:
  group: deepweave-iphone
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - name: Serve and exercise touch UI in Chromium and WebKit
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 2
          node tests/browser.playcheck.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deep-weave-iphone-playcheck
          path: playcheck-output/
          if-no-files-found: warn
