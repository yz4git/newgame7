name: Prototype checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Graph integrity
        run: node tests/graph.test.cjs
      - name: Gameplay smoke test
        run: node tests/engine.test.cjs
