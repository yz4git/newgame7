name: Prototype checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: KAWAII MOTION full gameplay
        run: node tests/dance.test.cjs
      - name: KAWAII MOTION ZIP clip pack
        run: node tests/clip-pack.test.cjs
      - name: Verify bundled preview MP4 files
        run: node tests/bundled-media.test.cjs
      - name: Legacy MOTION CHAIN graph integrity
        run: node tests/graph.test.cjs
      - name: Legacy MOTION CHAIN smoke test
        run: node tests/engine.test.cjs
      - name: Legacy storyboard coverage
        run: node tests/storyboards.test.cjs
