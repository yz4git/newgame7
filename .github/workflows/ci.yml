name: Deep Weave gameplay checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  engine:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate engine
        run: node tests/engine.test.cjs
      - name: Validate scripts and entry points
        run: |
          node --check engine.js
          node --check game.js
          test -s index.html && test -s style.css && test -s manifest.webmanifest
