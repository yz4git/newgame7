<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07131b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="指一本で探索する、環境連鎖型ターン制ローグライク。タップ・スワイプ・長押しで12層の深淵へ。">
<title>深界の織り手 — DEEP WEAVE</title>
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="stylesheet" href="./style.css?v=__DW_BUILD__">
</head><body>
<main id="app">
<header class="top">
  <div class="brand"><span class="sigil">✦</span><div><strong>深界の織り手</strong><small>DEEP WEAVE — ROGUELIKE</small></div></div>
  <div class="head-tools">
    <button id="soundButton" type="button" aria-label="音を出す">♫̸</button>
    <button id="newButton" type="button" aria-label="新しい冒険">↻</button>
    <button id="helpButton" type="button" aria-label="遊び方">?</button>
  </div>
</header>
<section class="hud" aria-label="冒険の状況">
  <div class="stat-strip">
    <div class="hud-row"><span id="floorLabel" class="floor">B1 / 12</span><span id="floorName" class="floor-sub">忘却の石廊</span></div>
    <div class="track"><div id="hpBar" class="hp-fill"></div></div>
  </div>
  <div class="stat-strip">
    <div class="hp"><span>HP</span><span id="hpText">30 / 30</span></div>
    <div class="hud-stats"><span>ATK <b id="atkText">5</b></span><span>TURN <b id="turnText">0</b></span></div>
  </div>
  <div class="hud-stats" style="grid-column:1/-1"><span>一歩が一手。静止すれば時間も止まる。</span><span class="counter">SCORE <b id="scoreText">0</b></span></div>
</section>
<section class="map-wrap" aria-label="ダンジョン">
  <div class="map-corners"><span id="viewFloor">B1</span><span>✦ THE DESCENT ✦</span></div>
  <div class="map-frame"><canvas id="board" width="360" height="440" aria-label="地図。タップで移動や攻撃、スワイプで一歩、長押しで調査" role="application"></canvas></div>
  <div class="map-corners"><span>THE UNKNOWN AWAITS</span><span id="viewTurn">TURN 0</span></div>
</section>
<section class="feedback"><div class="log" id="recent" aria-live="polite">影の底へ進もう。</div><div class="hint" id="hint">タップで進む · スワイプで1歩 · 長押しで調べる</div></section>
<section class="actions" aria-label="行動">
  <button type="button" id="bagButton" class="action primary"><strong>✧</strong><span>道具を使う</span><small id="bag">3/8</small></button>
  <button type="button" id="waitButton" class="action"><strong>◷</strong><span>1ターン待つ</span></button>
  <button type="button" id="legendButton" class="action" aria-label="絵と記号の図鑑"><strong>▦</strong><span>絵の図鑑</span></button>
</section>
<button type="button" id="cancelAim" hidden>✕ 対象選択を解除</button>
<p class="copyright">NO PAD. NO STICK. ONE FINGER, INFINITE CHOICES.</p>
</main>
<div id="toast" role="status"></div>
<div id="tooltip" hidden role="status"></div>
<aside id="sheet" hidden aria-label="道具袋"></aside><div id="sheetBackdrop"></div>
<div id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-box"><h2 id="modalTitle">深界の織り手</h2><div id="modalBody"></div><div id="modalActions" class="modal-actions"></div></div>
</div>
<script>
/*
 * Boot-time release sync. No background polling and no game interruption.
 * GitHub Pages stamps __DW_BUILD__ at deploy time with the commit SHA.
 */
(async () => {
  'use strict';
  const embedded = '__DW_BUILD__';
  const boot = { embeddedVersion: embedded, servedVersion: embedded, checked: false, redirected: false, fallback: false };
  window.__deepWeaveBoot = boot;
  let version = embedded;
  try {
    const resource = new URL('./version.json', document.baseURI);
    resource.searchParams.set('startup', Date.now().toString(36));
    const response = await fetch(resource.href, { cache: 'no-store' });
    if (!response.ok) throw new Error('Version check HTTP ' + response.status);
    const json = await response.json();
    if (!json || typeof json.version !== 'string' || !/^[a-zA-Z0-9._-]{1,80}$/.test(json.version)) {
      throw new Error('Invalid release version');
    }
    version = json.version;
  } catch (error) {
    // Offline: keep the cached/same-build shell usable without losing the run.
    boot.fallback = true;
    console.info('DEEP WEAVE: using bundled release', String(error));
  }
  boot.checked = true;
  boot.servedVersion = version;
  const currentUrl = new URL(location.href);
  if (version !== embedded && currentUrl.searchParams.get('dwv') !== version) {
    // Query-busting the DOCUMENT is essential for changes to HTML/UI itself.
    // When already on ?dwv=latest, do not redirect again: prevents loops
    // if a hosting cache momentarily serves an older index.html.
    currentUrl.searchParams.set('dwv', version);
    boot.redirected = true;
    location.replace(currentUrl.href);
    return;
  }
  // JS uses the same release ID as the styles, and is only loaded AFTER
  // a single startup check. No update requests are made during gameplay.
  const withVersion = (path) => {
    const u = new URL(path, document.baseURI);
    u.searchParams.set('v', version);
    return u.href;
  };
  const loadScript = (path) => new Promise((resolve, reject) => {
    const tag = document.createElement('script');
    tag.src = withVersion(path);
    tag.async = false;
    tag.onload = resolve;
    tag.onerror = () => reject(new Error('Failed to load ' + path));
    document.body.appendChild(tag);
  });
  try {
    await loadScript('./engine.js');
    await loadScript('./game.js');
    boot.ready = true;
  } catch (error) {
    boot.ready = false;
    console.error('DEEP WEAVE startup failed', error);
    const notice = document.createElement('div');
    notice.setAttribute('role', 'alert');
    notice.style.cssText = 'padding:20px;color:#ffe0b1;text-align:center;line-height:1.8;font:15px sans-serif;background:#142a35';
    notice.textContent = 'ゲームを読み込めませんでした。通信を確認し、ページを再読み込みしてください。';
    document.body.prepend(notice);
  }
})();
</script>
</body></html>
